services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    # Sem volume de código-fonte e sem --reload: imagem imutável de produção.
    # MongoDB não roda local — MONGODB_URL aponta para o Atlas via .env.
    command:
      - "uv"
      - "run"
      - "uvicorn"
      - "app.main:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
